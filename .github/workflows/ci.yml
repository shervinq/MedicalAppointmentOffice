name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MedicalAppointmentOffice.sln
      - run: dotnet build MedicalAppointmentOffice.sln -c Release --no-restore
      - run: dotnet test MedicalAppointmentOffice.sln -c Release --no-build --logger trx
      - run: docker build -t medical-appointment-office:${{ github.sha }} .
